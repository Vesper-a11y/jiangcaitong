name: JiangCaiTong
options:
  bundleIdPrefix: com.jxufe
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  JiangCaiTong:
    type: application
    platform: iOS
    sources:
      - path: JiangCaiTong
        excludes:
          - "web/**"
          - "Info.plist"
      # 🔴 界面目录必须作为**整目录引用**（folder reference）打进 bundle，
      #    不能在 Xcode 里摊平成一堆文件 —— `index.html` 里那些相对路径
      #    （`app.js`、`app.css`）是靠目录结构找的，摊平就全部 404。
      #    这一条对应安卓的 `assets/web`。
      #
      #    ⚠️ XcodeGen 没有 target 级的 `resources:` 这个 key，资源要靠
      #    sources 里的 buildPhase 指定。写成 `resources:` 会被**静默忽略**，
      #    编译能过、装上一看是白屏。
      - path: JiangCaiTong/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jxufe.jiangcaitong
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: JiangCaiTong/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        # 云编译不签名，产出未签名 ipa，再由 SideStore 用用户自己的
        # Apple ID 重签。这里不签名是有意的，别改成自动签名 ——
        # 自动签名需要在 CI 里放证书，那等于把私钥交出去。
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        ONLY_ACTIVE_ARCH: "NO"
    scheme:
      testTargets: []
