name: Release（已停用自动触发）

# ============================================================
# 🔴 2026-11-28：自动发版路线**暂不使用**，tag 自动触发已关掉。
#    正式发版只走交接包 5.1 的手动路线（本地出包 → 重建快照 → 两边传附件）。
#    保留本文件只为留档、以及以后想启用时改回来；现在只能在 Actions 页
#    手动点「Run workflow」才会跑，推 v* tag 不会再自动打出包。
#
#    停用的四个原因（详见交接包 5.1）：
#      1. 本文件生成的 version.json 用 updateLog 字符串，而 App 只认
#         changelog / notes 数组（web/native.js:244）→ 用户点「检查更新」会看到空窗口；
#      2. versionCode 用 主*10000+次*100+修订（v1.0.3 → 10003），
#         与本地 build_apk.py 默认的 1.0.3=5 分叉，会让更新检查反复提示；
#      3. generate_release_notes 会把提交标题拼进公开页，措辞不可控；
#      4. Gitee 侧 Release 附件本来就不自动同步，两边流程仍得分开做。
#
# 原流程说明（留档）：
#   checkout → Python + JDK17 → 补齐 Android SDK 组件 →
#   从 tag 解析版本号 → python android/build_apk.py 打包签名 →
#   生成 version.json → 创建 GitHub Release 并上传 APK + version.json。
#   version.json 只在流水线里临时生成、随 Release 附件上传，
#   不写回代码仓库（App 的更新检查读的是 Release 附件那份）。
#
# 若以后要重新启用：先修上面 1、2 两处，把 on: 改回 push/tags 'v*'，
# 补齐下面的 Secret，并同步交接包 5.1 的说明。
#
# 首次配置 Secret（仅重新启用时需要）：
#   Settings → Secrets and variables → Actions：
#     - JCT_KEYSTORE_B64：签名 keystore 的 base64（不要带 PEM 头尾，解码步骤会剥）
#     - JCT_KS_PASS：keystore 口令（与本地打包用的一致）
#   签名密钥必须和本地一直在用的同一把，否则老用户无法覆盖安装；
#   脚本带 JCT_REQUIRE_KEYSTORE=1，Secret 没配会直接失败，绝不现场生成新密钥。
#   工具链：build-tools 34.0.0 + platforms android-33 + JDK 17，
#   换版本要三处一起改：这里、build_apk.py 顶部 BT/ANDROID_JAR、MIN_SDK/TARGET_SDK。
# ============================================================

on:
  workflow_dispatch:        # 仅手动点触发；推 v* tag 不再自动发版

permissions:
  contents: write          # 创建 Release / 上传附件需要的最小权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11（build_apk.py 是纯 Python 构建）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 JDK 17（javac / apksigner 都走它）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 补齐 Android SDK 组件（build-tools 34.0.0 + platform 33）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-33" > /dev/null
          echo "SDK 就绪：$ANDROID_HOME"

      - name: 检查签名 Secret 是否已配置
        env:
          JCT_KEYSTORE_B64: ${{ secrets.JCT_KEYSTORE_B64 }}
        run: |
          if [ -z "$JCT_KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret JCT_KEYSTORE_B64（keystore 的 base64）。"
            echo "        到 Settings → Secrets and variables → Actions 添加后再打 tag。"
            exit 1
          fi

      - name: 解出签名密钥（只放进临时目录，不落仓库）
        env:
          JCT_KEYSTORE_B64: ${{ secrets.JCT_KEYSTORE_B64 }}
        run: |
          # 剥掉可能的 PEM 头尾和空白再解码（防御 certutil 产物）
          python3 - << 'PYEOF'
          import base64, os, re
          s = os.environ["JCT_KEYSTORE_B64"]
          s = re.sub(r"-----[^-]+-----", "", s)
          s = "".join(s.split())
          out = os.path.join(os.environ["RUNNER_TEMP"], "jiangcaitong.keystore")
          open(out, "wb").write(base64.b64decode(s))
          print("keystore written:", out)
          PYEOF
          echo "JCT_KEYSTORE=$RUNNER_TEMP/jiangcaitong.keystore" >> "$GITHUB_ENV"

      - name: 从 tag 解析版本号
        run: |
          TAG="${GITHUB_REF_NAME}"                    # 例如 v1.0.3
          VER="${TAG#v}"                              # 1.0.3
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 vX.Y.Z 格式，收到：$TAG"
            exit 1
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "JCT_VERSION_NAME=$VER"
            echo "JCT_VERSION_CODE=$CODE"
            echo "JCT_APK=jiangcaitong-$VER.apk"
          } >> "$GITHUB_ENV"
          echo "版本 $VER / versionCode $CODE"

      - name: 打包（build_apk.py：aapt2 → javac → d8 → zipalign → apksigner）
        env:
          JCT_VERSION_NAME: ${{ env.JCT_VERSION_NAME }}
          JCT_VERSION_CODE: ${{ env.JCT_VERSION_CODE }}
          JCT_KS_PASS: ${{ secrets.JCT_KS_PASS }}
          JCT_REQUIRE_KEYSTORE: '1'                 # 没有现成密钥就报错，不现场生成
        run: |
          # ANDROID_HOME 是 runner 自带环境变量，只能在这层传给构建脚本
          HYT_SDK="$ANDROID_HOME" python android/build_apk.py
          ls -lh android/dist/

      - name: 生成 version.json（只在流水线里临时存在，不提交回仓库）
        run: |
          VER="$JCT_VERSION_NAME"
          CODE="$JCT_VERSION_CODE"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JCT_APK}"
          python3 - "$VER" "$CODE" "$URL" "$GITHUB_REF_NAME" << 'PYEOF' > version.json
import json, sys
ver, code, url, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
out = {
    "versionName": ver,
    "versionCode": code,
    "downloadUrl": url,
    "updateLog": "自动发布版本 " + tag,
}
print(json.dumps(out, ensure_ascii=False, indent=2))
PYEOF
          cat version.json

      - name: 创建 GitHub Release 并上传 APK + version.json
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true              # 自动生成 Release Notes
          files: |
            android/dist/${{ env.JCT_APK }}
            version.json
