name: Release

# ============================================================
# 2026-11-28 起：自动发版已停用，本工作流只在手动触发时执行。
#   发版流程改为由维护者手动完成，GitHub 与 Gitee 两端同时发布。
#
# 为什么之前停用过、这次又打开（两个坑已经填了，别再踩回去）：
#   1. version.json 以前写 `updateLog` 字符串，而 App 只认 `changelog` / `notes`
#      数组（web/native.js:244）→ 用户点「检查更新」看到的是空窗口。
#      现在直接拿仓库里那份 version.json 的 `changelog`，只覆盖版本号和下载地址。
#   2. versionCode 以前按 主*10000+次*100+修订 现算（v1.0.3 → 10003），
#      而本地 build_apk.py 用的是 web/app.js 里的 APP_CODE（1.0.3 → 5），
#      两边分叉 → 装完线上包再装本地包，更新检查会一直提示有新版。
#      现在**唯一来源就是 web/app.js 的 APP_CODE**，本地和 CI 用同一个数。
#   3. Release 正文用 version.json 的 changelog 拼，不开 generate_release_notes
#      （提交标题会漏进公开页，措辞不可控）。
#   4. Gitee 侧附件本来就不自动同步 —— 发完版仍要按交接包 5.1 手动传一次。
#
# 首次配置 Secret：
#   Settings → Secrets and variables → Actions：
#     - JCT_KEYSTORE_B64：签名 keystore 的 base64（不要带 PEM 头尾，解码步骤会剥）
#     - JCT_KS_PASS：keystore 口令（与本地打包用的一致）
#   签名密钥必须和本地一直在用的同一把，否则老用户无法覆盖安装；
#   脚本带 JCT_REQUIRE_KEYSTORE=1，Secret 没配会直接失败，绝不现场生成新密钥。
#   工具链：build-tools 34.0.0 + platforms android-33 + JDK 17，
#   换版本要三处一起改：这里、build_apk.py 顶部 BT/ANDROID_JAR、MIN_SDK/TARGET_SDK。
# ============================================================

on:
  # 2026-11-28：按维护者要求取消自动发版。推 tag 不再触发打包，
  # 发版改为由维护者手动完成（GitHub 与 Gitee 两端同时发布）。
  # 如需恢复自动发版：先配好 JCT_KEYSTORE_B64、JCT_KS_PASS 两个 Secret，
  # 再把下面的 workflow_dispatch 换回 push.tags。
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release / 上传附件需要的最小权限

jobs:
  release:
    # 只对正式仓库生效：fork 里推 tag 不该发 Release。
    if: github.repository == 'Vesper-a11y/jiangcaitong'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11（build_apk.py 是纯 Python 构建）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 JDK 17（javac / apksigner 都走它）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 补齐 Android SDK 组件（build-tools 34.0.0 + platform 33）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-33" > /dev/null
          echo "SDK 就绪：$ANDROID_HOME"

      - name: 检查签名 Secret 是否已配置
        env:
          JCT_KEYSTORE_B64: ${{ secrets.JCT_KEYSTORE_B64 }}
        run: |
          if [ -z "$JCT_KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret JCT_KEYSTORE_B64（keystore 的 base64）。"
            echo "        到 Settings → Secrets and variables → Actions 添加后再打 tag。"
            exit 1
          fi

      - name: 解出签名密钥（只放进临时目录，不落仓库）
        env:
          JCT_KEYSTORE_B64: ${{ secrets.JCT_KEYSTORE_B64 }}
        run: |
          # 剥掉可能的 PEM 头尾和空白再解码（防御 certutil 产物）
          python3 - << 'PYEOF'
          import base64, os, re
          s = os.environ["JCT_KEYSTORE_B64"]
          s = re.sub(r"-----[^-]+-----", "", s)
          s = "".join(s.split())
          out = os.path.join(os.environ["RUNNER_TEMP"], "jiangcaitong.keystore")
          open(out, "wb").write(base64.b64decode(s))
          print("keystore written:", out)
          PYEOF
          echo "JCT_KEYSTORE=$RUNNER_TEMP/jiangcaitong.keystore" >> "$GITHUB_ENV"

      - name: 从 tag 解析版本号（versionCode 以 web/app.js 的 APP_CODE 为准）
        run: |
          TAG="${GITHUB_REF_NAME}"                    # 例如 v1.0.4
          VER="${TAG#v}"                              # 1.0.4
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 vX.Y.Z 格式，收到：$TAG"
            exit 1
          fi
          # 🔴 只认 app.js 里那个数：本地 build_apk.py 用的也是它。
          #    两处各算各的，装完线上包再装本地包就会一直提示有新版。
          CODE=$(grep -oE "const APP_CODE = [0-9]+" web/app.js | grep -oE "[0-9]+" | head -1)
          NAME_IN_CODE=$(grep -oE "const APP_VERSION = '[^']+'" web/app.js | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$CODE" ]; then
            echo "::error::web/app.js 里找不到 APP_CODE"
            exit 1
          fi
          if [ "$NAME_IN_CODE" != "$VER" ]; then
            echo "::error::tag 是 $VER，但 web/app.js 里 APP_VERSION 是 $NAME_IN_CODE —— 先改版本号再打 tag。"
            exit 1
          fi
          {
            echo "JCT_VERSION_NAME=$VER"
            echo "JCT_VERSION_CODE=$CODE"
            echo "JCT_APK=jiangcaitong-$VER.apk"
          } >> "$GITHUB_ENV"
          echo "版本 $VER / versionCode $CODE"

      - name: 打包（build_apk.py：aapt2 → javac → d8 → zipalign → apksigner）
        env:
          JCT_VERSION_NAME: ${{ env.JCT_VERSION_NAME }}
          JCT_VERSION_CODE: ${{ env.JCT_VERSION_CODE }}
          JCT_KS_PASS: ${{ secrets.JCT_KS_PASS }}
          JCT_REQUIRE_KEYSTORE: '1'                 # 没有现成密钥就报错，不现场生成
        run: |
          # ANDROID_HOME 是 runner 自带环境变量，只能在这层传给构建脚本
          HYT_SDK="$ANDROID_HOME" python android/build_apk.py
          ls -lh android/dist/

      - name: 生成 version.json 与 Release 正文（只在流水线里临时存在，不提交回仓库）
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JCT_APK}"
          # 更新说明取仓库 version.json 里手写的 changelog，脚本在 tools/gen_version.py
          python3 tools/gen_version.py "$JCT_VERSION_NAME" "$JCT_VERSION_CODE" "$URL"
          cat version.json

      - name: 创建 GitHub Release 并上传 APK + version.json
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false             # 正文用上面那份，不拼提交标题
          files: |
            android/dist/${{ env.JCT_APK }}
            version.json
